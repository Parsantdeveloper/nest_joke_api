version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: joke-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jokedb

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jokedb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: